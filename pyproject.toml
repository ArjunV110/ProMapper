[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "promapper"
version = "3.1.0"
description = "Production-grade cross-platform network scanner"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "promapper Team"},
]
keywords = ["network", "scanner", "security", "nmap", "port-scan"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/anomalyco/promapper"
Repository = "https://github.com/anomalyco/promapper"
Issues = "https://github.com/anomalyco/promapper/issues"

[project.optional-dependencies]
scapy = ["scapy"]
crypto = ["cryptography"]
paramiko = ["paramiko"]
dnspython = ["dnspython"]
full = ["scapy", "cryptography", "paramiko", "dnspython"]

[project.scripts]
promapper = "promapper.cli:main"

[tool.setuptools.packages.find]
include = ["promapper*"]
